[build-system]
requires = [
    "setuptools==75.1.0",
    "wheel==0.44.0"
]
build-backend = "setuptools.build_meta"


[project]
name = "lortia-plus"
version = "1.0.0"
description = "LoRTIA Plus: a feature-first long-read transcriptome annotation workflow"
readme = "README.md"
requires-python = ">=3.10,<3.11"

dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "polars==1.8.2",
    "pysam==0.22.1",
    "scipy==1.14.1",
    "biopython==1.88"
]


[project.urls]
Repository = "https://github.com/philipmories/LoRTIA-Plus"
Archive = "https://doi.org/10.5281/zenodo.19348065"


[tool.setuptools]
package-dir = {"" = "LoRTIA_Plus"}

py-modules = [
    "Samprocessor",
    "Stats",
    "Gff_creator",
    "Transcript_Annotator",
    "Fusion_Annotator",
    "Sum_gffs",
    "Sum_gffs_fast"
]

script-files = [
    "LoRTIA_Plus/LoRTIA"
]
