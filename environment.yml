name: lortia-plus

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.10.14
  - numpy=1.26.4
  - pandas=2.2.3
  - polars=1.8.2
  - pysam=0.22.1
  - scipy=1.14.1
  - biopython=1.88
  - samtools=1.20
  - gawk=5.3.1
  - pip=24.2
  - setuptools=75.1.0
  - wheel=0.44.0

# Prevent undeclared packages from the user's Python site directory from
# overriding packages in the pinned LoRTIA Plus environment.
variables:
  PYTHONNOUSERSITE: "1"
